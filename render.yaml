services:
  - type: worker
    name: blackberry-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: SPAM_LIMIT
        value: "3"
      - key: SPAM_WINDOW
        value: "3"
      - key: BOT_TIMEZONE
        value: Asia/Kolkata
      - key: DATABASE_URL
        sync: false
